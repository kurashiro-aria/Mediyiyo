name: Build Mediyiyo APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Android compilation
        run: gradle assembleDebug

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.MEDIYIYO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MEDIYIYO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MEDIYIYO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MEDIYIYO_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing MEDIYIYO_KEYSTORE_BASE64" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing MEDIYIYO_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing MEDIYIYO_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing MEDIYIYO_KEY_PASSWORD" && exit 1)

      - name: Restore Mediyiyo signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MEDIYIYO_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mediyiyo-release.jks"

      - name: Build signed release APK
        env:
          MEDIYIYO_KEYSTORE_PATH: ${{ runner.temp }}/mediyiyo-release.jks
          MEDIYIYO_KEYSTORE_PASSWORD: ${{ secrets.MEDIYIYO_KEYSTORE_PASSWORD }}
          MEDIYIYO_KEY_ALIAS: ${{ secrets.MEDIYIYO_KEY_ALIAS }}
          MEDIYIYO_KEY_PASSWORD: ${{ secrets.MEDIYIYO_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Mediyiyo-0.3.0-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
