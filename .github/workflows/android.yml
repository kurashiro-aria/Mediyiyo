name: Build Mediyiyo APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Require Mediyiyo release signing Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.MEDIYIYO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MEDIYIYO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MEDIYIYO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MEDIYIYO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::The four Mediyiyo release signing Secrets are required."
            exit 1
          fi

      - name: Restore Mediyiyo signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MEDIYIYO_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mediyiyo-release.jks"

      - name: Build signed release APK
        env:
          MEDIYIYO_KEYSTORE_PATH: ${{ runner.temp }}/mediyiyo-release.jks
          MEDIYIYO_KEYSTORE_PASSWORD: ${{ secrets.MEDIYIYO_KEYSTORE_PASSWORD }}
          MEDIYIYO_KEY_ALIAS: ${{ secrets.MEDIYIYO_KEY_ALIAS }}
          MEDIYIYO_KEY_PASSWORD: ${{ secrets.MEDIYIYO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle testDebugUnitTest assembleRelease -PmediyiyoVersionCode="$((3 + GITHUB_RUN_NUMBER))"

      - name: Verify release signature
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Verify package, version and original certificate
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$apksigner" && test -n "$aapt"
          expected_cert=047d8d32bd01378648e99ad9a67f9a40e7fce4b93449b8e7e40adec7c8a338f5
          cert_output="$("$apksigner" verify --print-certs "$apk")"
          cert_digest="$(printf '%s\n' "$cert_output" | awk -F': ' '/certificate SHA-256 digest/ {print tolower($2); exit}' | tr -d '[:space:]:' )"
          echo "Release certificate SHA-256: $cert_digest"
          package_line="$("$aapt" dump badging "$apk" | sed -n '1p')"
          echo "$package_line"
          test "$cert_digest" = "$expected_cert"
          expected_code="$((3 + GITHUB_RUN_NUMBER))"
          [[ "$package_line" == *"name='cl.kura.mediyiyo'"* ]]
          [[ "$package_line" == *"versionCode='$expected_code'"* ]]
          [[ "$package_line" == *"versionName='0.4.0'"* ]]
          echo "Original Mediyiyo certificate SHA-256 verified."

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Mediyiyo-0.4.0-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
