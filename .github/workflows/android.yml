name: Build Mediyiyo APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Require Mediyiyo release signing Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.MEDIYIYO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MEDIYIYO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MEDIYIYO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MEDIYIYO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::The four Mediyiyo release signing Secrets are required."
            exit 1
          fi

      - name: Restore Mediyiyo signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MEDIYIYO_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mediyiyo-release.jks"

      - name: Build signed release APK
        env:
          MEDIYIYO_KEYSTORE_PATH: ${{ runner.temp }}/mediyiyo-release.jks
          MEDIYIYO_KEYSTORE_PASSWORD: ${{ secrets.MEDIYIYO_KEYSTORE_PASSWORD }}
          MEDIYIYO_KEY_ALIAS: ${{ secrets.MEDIYIYO_KEY_ALIAS }}
          MEDIYIYO_KEY_PASSWORD: ${{ secrets.MEDIYIYO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle assembleRelease -PmediyiyoVersionCode="$((3 + GITHUB_RUN_NUMBER))"

      - name: Verify release signature
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Mediyiyo-0.3.6-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
