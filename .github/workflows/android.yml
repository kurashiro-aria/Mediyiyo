name: Build Mediyiyo APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Mediyiyo-0.3.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Check whether release signing is configured
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.MEDIYIYO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MEDIYIYO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MEDIYIYO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MEDIYIYO_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Release signing not configured; debug APK was still produced."
          fi

      - name: Restore Mediyiyo signing key
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.MEDIYIYO_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mediyiyo-release.jks"

      - name: Build signed release APK
        if: steps.signing.outputs.ready == 'true'
        env:
          MEDIYIYO_KEYSTORE_PATH: ${{ runner.temp }}/mediyiyo-release.jks
          MEDIYIYO_KEYSTORE_PASSWORD: ${{ secrets.MEDIYIYO_KEYSTORE_PASSWORD }}
          MEDIYIYO_KEY_ALIAS: ${{ secrets.MEDIYIYO_KEY_ALIAS }}
          MEDIYIYO_KEY_PASSWORD: ${{ secrets.MEDIYIYO_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Upload signed APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Mediyiyo-0.3.0-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
